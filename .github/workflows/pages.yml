name: Public page
on:
  push:
    branches: [main]
    paths: ["site/**", "agent/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["Oil Desk agent", "Deploy vault"]
    types: [completed]
  schedule:
    - cron: "40 */6 * * *"   # refresh market view and crowd odds even between agent runs
  workflow_dispatch:
permissions:
  contents: write   # publishes the built page to the gh-pages branch
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: oil_dashboard/requirements.txt }
      - run: pip install -r oil_dashboard/requirements.txt
      - name: Export live data for the page
        continue-on-error: true   # if a data source is down, the page falls back to the sample track record
        env:
          NETWORK: hashkey
          RPC_URL: https://mainnet.hsk.xyz
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          STREAMLIT_URL: ${{ vars.STREAMLIT_URL }}
        run: python agent/export_site.py
      - name: Publish to gh-pages
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="oil-desk-bot" -c user.email="oil-desk-bot@users.noreply.github.com" commit -qm "Publish page from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
