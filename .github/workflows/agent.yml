name: Oil Desk agent
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (GitHub may delay scheduled runs); the Public page workflow follows each run
  workflow_dispatch:
    inputs:
      network:
        type: choice
        options: [hashkey, hashkeyTestnet]
        default: hashkey
permissions:
  contents: write
concurrency: { group: chain-writes, cancel-in-progress: false }
jobs:
  decide:
    runs-on: ubuntu-latest
    env:
      NETWORK: ${{ inputs.network || 'hashkey' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the vault is deployed and the agent key is set
        id: ready
        env:
          HAS_KEY: ${{ secrets.AGENT_KEY != '' }}
        run: |
          if [ -f "deployments/$NETWORK.json" ] && [ "$HAS_KEY" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No vault on $NETWORK yet, or AGENT_KEY isn't set. Skipping this cycle (run 'Deploy vault' first)."
          fi
      - uses: actions/setup-python@v5
        if: steps.ready.outputs.ok == 'true'
        with: { python-version: "3.12", cache: pip, cache-dependency-path: oil_dashboard/requirements.txt }
      - run: pip install -r oil_dashboard/requirements.txt
        if: steps.ready.outputs.ok == 'true'
      - name: Run one decision cycle
        if: steps.ready.outputs.ok == 'true'
        env:
          RPC_URL: ${{ env.NETWORK == 'hashkeyTestnet' && 'https://testnet.hsk.xyz' || 'https://mainnet.hsk.xyz' }}
          AGENT_KEY: ${{ secrets.AGENT_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.tokenfactory.nebius.com/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python agent/run.py
      - name: Publish the full decision record
        if: always() && steps.ready.outputs.ok == 'true'
        run: |
          git config user.name "oil-desk-bot"
          git config user.email "oil-desk-bot@users.noreply.github.com"
          git add records/ || true
          git commit -m "Decision record $(date -u +%FT%TZ)" && git pull --rebase && git push || echo "nothing to commit"
